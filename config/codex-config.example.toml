# ~/.codex/config.toml — templates (desensitized)
# Merge the blocks below into ~/.codex/config.toml.
# Prefer DeepSeek's one-click setup script; these blocks are the manual fallback.

# ── top-level model defaults ──

model = "deepseek-v4-flash"
model_provider = "deepseek"
model_catalog_json = "<abs-path>/models.json"   # Windows: absolute path, forward slashes (tilde does NOT expand)

# ── Layer 3b: DeepSeek official provider (Responses API) ──

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"
env_key = "DEEPSEEK_API_KEY"          # key stays in env; do NOT use experimental_bearer_token

# ── Optional: OpenCode Zen free tier via Responses API ──

[model_providers.opencode-zen]
name = "OpenCode Zen"
base_url = "https://opencode.ai/zen/v1"
wire_api = "responses"
env_key = "OPENCODE_GO_API_KEY"

# ── Layer 3a: codex-plus-hermes-team MCP (reverse consult) ──

[mcp_servers.hermes-team]
command = "node"
args = ["<abs-path>/codex-plus-hermes-team/dist/index.js"]

[mcp_servers.hermes-team.env]
CODEX_PLUS_HERMES_TEAM_CONFIG = "<abs-path>/codex-plus-hermes-team/team.yaml"

# models.json is generated by DeepSeek's setup script, or extract it from:
# https://api-docs.deepseek.com/quick_start/agent_integrations/codex/
